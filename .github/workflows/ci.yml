name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run behavior tests and Lua 5.1 compilation
        run: python tests/run_tests.py
      - name: Build the installable addon ZIP
        run: python tools/package.py
      - name: Verify the package and public documentation
        run: |
          python tests/package.py
          python tools/check_publication.py
